services:
  db:
    image: mysql:8.4
    command: ["--default-time-zone=+08:00"]
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: library_project
      MYSQL_USER: library_app
      MYSQL_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD}
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - library_data:/var/lib/mysql
      - ./sql/01_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./sql/04_app_privileges.sql:/docker-entrypoint-initdb.d/04_app_privileges.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1"]
      interval: 5s
      timeout: 3s
      retries: 30
volumes:
  library_data:
